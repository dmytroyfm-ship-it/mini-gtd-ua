# Конфігурація для Netlify.
# Застосунок повністю статичний (HTML/CSS/JS), збірки не потребує —
# publish = "." означає «опублікувати корінь репозиторію як є».
#
# Редірект нижче потрібен клієнтському роутеру (js/router.js): без
# нього пряме відкриття чи оновлення сторінки на кшталт /list/next
# поверне 404, бо такого файлу на диску немає — Netlify має віддавати
# index.html для будь-якого шляху, а вже JS сам розбереться, що
# показати. Той самий принцип, що й у scripts/serve.py для локальної
# розробки.

[build]
  publish = "."
  # Пропустити деплой, якщо між останнім задеплоєним комітом і цим
  # змінилась лише документація (docs/, кореневі *.md) чи .claude/ —
  # такі зміни не впливають на сам сайт, деплоїти їх сенсу нема.
  # `git diff --quiet` повертає 0 (нема відмінностей поза цими
  # шляхами) → Netlify скасовує білд; 1 (є інші зміни) → білдить як
  # завжди.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!docs' ':!*.md' ':!.claude'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
