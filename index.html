<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Застосовує збережену тему (js/store/themeStore.js, той самий
       ключ localStorage) синхронно, до першого пофарбованого пікселя
       — без цього при світлій темі на мить блимала б темна (застосунок
       темний за замовчуванням), поки не завантажиться й не виконається
       app.js. -->
  <script>
    (function () {
      try {
        if (localStorage.getItem("mini-gtd-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (e) {}
    })();
  </script>
  <title>Mini GTD</title>
  <meta name="description" content="Mini GTD — простий персональний менеджер задач за методологією GTD." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/nav.css" />
  <link rel="stylesheet" href="/css/page.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/task-form.css" />
  <link rel="stylesheet" href="/css/task-list.css" />
  <link rel="stylesheet" href="/css/task-card.css" />
  <link rel="stylesheet" href="/css/trash.css" />
  <link rel="stylesheet" href="/css/history.css" />
  <link rel="stylesheet" href="/css/board.css" />
  <link rel="stylesheet" href="/css/task-detail.css" />
  <link rel="stylesheet" href="/css/integrations.css" />
  <link rel="stylesheet" href="/css/sources.css" />
  <link rel="stylesheet" href="/css/feed.css" />
  <link rel="stylesheet" href="/css/search.css" />
</head>
<body>
  <div class="user-bg" id="user-bg" aria-hidden="true"></div>

  <header class="nav" id="nav-root"></header>
  <main class="page" id="page-root"></main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
