# Конфігурація Supabase CLI — потрібна лише для деплою Edge Functions
# (supabase/functions/); на решту проєкту (SQL-міграції виконуються
# вручну в SQL Editor) не впливає.

project_id = "ufjkundsaelfstfxslck"

# Telegram шле POST без Supabase-сесії (JWT) — за замовчуванням
# Supabase відхилив би такий запит ще до нашого коду. verify_jwt =
# false вимикає цю перевірку саме для цієї функції; захист від чужих
# запитів — окремий секрет TELEGRAM_WEBHOOK_SECRET, який звіряє сам
# код функції (див. index.ts).
[functions.telegram-webhook]
verify_jwt = false

# Той самий принцип — цю функцію викликає не Telegram, а pg_cron
# зсередини бази (jsonb-запит без JWT), захист — CRON_SECRET.
[functions.daily-reminder]
verify_jwt = false

# Той самий принцип — цю функцію викликає зовнішній парсер
# (Apify/Firecrawl тощо), а не наш застосунок і не Supabase-сесія,
# захист — FEED_WEBHOOK_SECRET.
[functions.feed-webhook]
verify_jwt = false

# Той самий принцип, що й daily-reminder — цю функцію теж викликає
# pg_cron (не Supabase-сесія), захист — той самий CRON_SECRET.
[functions.feed-poll]
verify_jwt = false
